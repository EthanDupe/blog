<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ethan Anaya — Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf9f6;
      --surface: #f2f0eb;
      --ink: #161618;
      --ink-secondary: #52525b;
      --muted: #71717a;
      --border: #e4e2db;
      --accent: #1d4ed8;
      --accent-hover: #1e40af;
      --accent-soft: rgba(29, 78, 216, 0.08);
      --code-bg: #efece6;
      --font-serif: 'Newsreader', Georgia, 'Times New Roman', serif;
      --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --max-w: 680px;
      --radius: 6px;
    }

    [data-theme="dark"] {
      --bg: #111113;
      --surface: #18181b;
      --ink: #ececee;
      --ink-secondary: #a1a1aa;
      --muted: #82828c;
      --border: #26262b;
      --accent: #60a5fa;
      --accent-hover: #93c5fd;
      --accent-soft: rgba(96, 165, 250, 0.12);
      --code-bg: #1b1b1f;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--ink);
      font-family: var(--font-sans);
      line-height: 1.65;
      transition: background-color 0.2s ease, color 0.2s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      text-underline-offset: 3px;
    }

    a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    button { font-family: inherit; cursor: pointer; }

    .container {
      width: 100%;
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 0 clamp(18px, 4.5vw, 32px);
    }

    /* Header */
    .site-header {
      border-bottom: 1px solid var(--border);
      padding: 20px 0;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand:hover { color: var(--ink); text-decoration: none; }

    .brand-name {
      font-family: var(--font-serif);
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--muted);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .nav-link {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--ink-secondary);
      text-decoration: none;
      padding: 4px 0;
      position: relative;
      transition: color 0.15s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--ink);
      text-decoration: none;
    }

    .nav-link.active::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      height: 1.5px;
      background: var(--accent);
    }

    .theme-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--ink-secondary);
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.15s ease, color 0.15s ease;
    }

    .theme-btn:hover {
      border-color: var(--ink-secondary);
      color: var(--ink);
    }

    /* Main */
    main {
      flex: 1;
      padding: 40px 0 64px;
    }

    /* Filter bar */
    .controls {
      margin-bottom: 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      color: var(--muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 9px 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .search-input::placeholder { color: var(--muted); }

    .search-input:focus {
      border-color: var(--accent);
      background: var(--bg);
    }

    .search-clear {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      color: var(--muted);
      padding: 4px 6px;
      font-size: 0.95rem;
      display: none;
    }

    .search-clear.visible { display: inline-flex; }
    .search-clear:hover { color: var(--ink); }

    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .tag-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 11px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--ink-secondary);
      transition: all 0.15s ease;
    }

    .tag-btn:hover {
      border-color: var(--ink-secondary);
      color: var(--ink);
    }

    .tag-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 500;
    }

    /* Post list */
    .year-group { margin-bottom: 36px; }
    .year-group:last-child { margin-bottom: 0; }

    .year-label {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin: 0 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .post-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .post-item { border-bottom: 1px solid var(--border); }
    .post-item:last-child { border-bottom: none; }

    .post-link {
      display: grid;
      grid-template-columns: 78px 1fr;
      gap: 4px 18px;
      padding: 16px 0;
      color: inherit;
      text-decoration: none;
    }

    .post-link:hover { text-decoration: none; }
    .post-link:hover .post-title { color: var(--accent); }

    .post-date {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--muted);
      padding-top: 4px;
      white-space: nowrap;
    }

    .post-title {
      font-family: var(--font-serif);
      font-size: 1.24rem;
      font-weight: 500;
      line-height: 1.32;
      color: var(--ink);
      margin: 0 0 4px;
      transition: color 0.15s ease;
    }

    .post-excerpt {
      font-size: 0.92rem;
      color: var(--ink-secondary);
      margin: 0 0 8px;
      line-height: 1.5;
    }

    .post-meta-inline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--muted);
    }

    .post-tag-pill { color: var(--ink-secondary); }

    .status-box {
      padding: 40px 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 14px;
      font-size: 0.88rem;
      font-weight: 500;
      color: var(--ink);
      display: inline-block;
      margin-top: 10px;
    }

    .btn-secondary:hover {
      border-color: var(--ink-secondary);
      text-decoration: none;
    }

    /* Article Reader */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .back-link:hover { color: var(--ink); text-decoration: none; }

    .article-header {
      margin-bottom: 32px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border);
    }

    .article-title {
      font-family: var(--font-serif);
      font-size: clamp(1.75rem, 4vw, 2.3rem);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin: 0 0 14px;
    }

    .article-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--muted);
    }

    .prose {
      font-size: 1.04rem;
      line-height: 1.78;
      color: var(--ink);
    }

    .prose > *:first-child { margin-top: 0; }

    .prose h2 {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 600;
      margin: 2em 0 0.6em;
      line-height: 1.28;
      letter-spacing: -0.015em;
    }

    .prose h3 {
      font-family: var(--font-serif);
      font-size: 1.22rem;
      font-weight: 600;
      margin: 1.6em 0 0.5em;
      line-height: 1.35;
    }

    .prose p { margin: 0 0 1.25em; }
    .prose ul, .prose ol { margin: 0 0 1.25em; padding-left: 1.4em; }
    .prose li { margin-bottom: 0.4em; }

    .prose blockquote {
      margin: 1.5em 0;
      padding: 2px 0 2px 18px;
      border-left: 2.5px solid var(--accent);
      color: var(--ink-secondary);
      font-style: italic;
    }

    .prose hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2em 0;
    }

    .prose img {
      max-width: 100%;
      height: auto;
      border-radius: var(--radius);
      margin: 1.2em 0;
      display: block;
    }

    .prose code {
      font-family: var(--font-mono);
      font-size: 0.86em;
      background: var(--code-bg);
      padding: 2px 5px;
      border-radius: 4px;
    }

    .code-block {
      margin: 1.4em 0;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--muted);
    }

    .copy-code-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .copy-code-btn:hover { color: var(--ink); background: var(--border); }

    .code-block pre {
      margin: 0;
      padding: 14px 16px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      line-height: 1.55;
    }

    .code-block pre code { background: none; padding: 0; font-size: inherit; }

    .article-footer-nav {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .pager-link {
      display: flex;
      flex-direction: column;
      gap: 3px;
      text-decoration: none;
      color: var(--ink);
    }

    .pager-link:hover { text-decoration: none; }
    .pager-link:hover .pager-title { color: var(--accent); }
    .pager-link.next { text-align: right; align-items: flex-end; }

    .pager-label {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--muted);
    }

    .pager-title {
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    /* Footer */
    .site-footer {
      border-top: 1px solid var(--border);
      padding: 24px 0;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-links { display: flex; gap: 16px; }
    .footer-links a { color: var(--muted); }
    .footer-links a:hover { color: var(--ink); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: var(--ink);
      color: var(--bg);
      padding: 9px 16px;
      border-radius: var(--radius);
      font-size: 0.86rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
    }

    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 560px) {
      .post-link { grid-template-columns: 1fr; gap: 2px; }
      .post-date { padding-top: 0; }
      .article-footer-nav { grid-template-columns: 1fr; }
      .pager-link.next { text-align: left; align-items: flex-start; }
      .nav { gap: 14px; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="brand">
        <span class="brand-name" id="site-title">Ethan Anaya</span>
        <span class="brand-sub">/blog</span>
      </a>
      <nav class="nav" aria-label="Main navigation">
        <a href="#/" class="nav-link active">Posts</a>
        <a href="write.html" class="nav-link">Write</a>
        <a href="https://github.com/EthanDupe" target="_blank" rel="noopener noreferrer" class="nav-link" id="main-site-link">GitHub</a>
        <button type="button" class="theme-btn" id="theme-toggle" aria-label="Toggle color theme" title="Toggle theme"></button>
      </nav>
    </div>
  </header>

  <main class="container" id="app" aria-live="polite">
    <div class="status-box">Loading posts...</div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span id="footer-copy">&copy; 2026 Ethan Anaya</span>
      <div class="footer-links">
        <a href="#/">Posts</a>
        <a href="write.html">Write</a>
        <a href="https://github.com/EthanDupe" target="_blank" rel="noopener noreferrer" id="footer-github">GitHub</a>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const SITE_CONFIG = {
      title: "Ethan Anaya",
      author: "Ethan Anaya",
      githubUser: "EthanDupe",
      githubRepo: "blog",
      postsFolder: "posts",
      mainSiteLabel: "GitHub",
      mainSiteUrl: "https://github.com/EthanDupe"
    };

    const THEME_KEY = 'ethan_blog_theme_v1';
    let state = { posts: [], search: '', activeTag: 'all', loaded: false, error: null };

    function storageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function storageSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

    function initTheme() {
      const saved = storageGet(THEME_KEY);
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(saved || (prefersDark ? 'dark' : 'light'));
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      storageSet(THEME_KEY, theme);
      const btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.innerHTML = theme === 'dark'
          ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>'
          : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatShortDate(iso) {
      const parts = String(iso || '').split('-');
      if (parts.length !== 3) return iso || '';
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      return `${months[parseInt(parts[1], 10) - 1] || parts[1]} ${String(parseInt(parts[2], 10)).padStart(2, '0')}`;
    }

    function formatFullDate(iso) {
      const parts = String(iso || '').split('-');
      if (parts.length !== 3) return iso || '';
      const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      return `${months[parseInt(parts[1], 10) - 1] || parts[1]} ${parseInt(parts[2], 10)}, ${parts[0]}`;
    }

    function readingTime(text) {
      const words = String(text || '').trim().split(/\s+/).filter(Boolean).length;
      return `${Math.max(1, Math.round(words / 210))} min read`;
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
    }

    function copyText(text, msg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(msg)).catch(() => fallbackCopy(text, msg));
      } else {
        fallbackCopy(text, msg);
      }
    }

    function fallbackCopy(text, msg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); showToast(msg); } catch (e) {}
      document.body.removeChild(ta);
    }

    // Parse Markdown file with optional --- frontmatter ---
    function parsePostFile(filename, raw) {
      const text = String(raw || '').replace(/\r\n/g, '\n');
      const slug = filename.replace(/\.md$/i, '');
      let meta = { title: '', date: '', tags: [], summary: '' };
      let body = text;

      const fmMatch = text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
      if (fmMatch) {
        body = fmMatch[2].trim();
        fmMatch[1].split('\n').forEach(line => {
          const idx = line.indexOf(':');
          if (idx === -1) return;
          const key = line.slice(0, idx).trim().toLowerCase();
          const val = line.slice(idx + 1).trim().replace(/^["']|["']$/g, '');
          if (key === 'title') meta.title = val;
          else if (key === 'date') meta.date = val;
          else if (key === 'summary' || key === 'description') meta.summary = val;
          else if (key === 'tags') {
            meta.tags = val.replace(/^\[|\]$/g, '').split(',').map(t => t.trim().toLowerCase().replace(/^#/, '')).filter(Boolean);
          }
        });
      }

      if (!meta.title) {
        const h1 = body.match(/^#\s+(.+)$/m);
        if (h1) {
          meta.title = h1[1].trim();
          body = body.replace(/^#\s+.+\n?/, '').trim();
        } else {
          meta.title = slug.replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }
      }

      if (!meta.date) {
        const dateInName = slug.match(/^(\d{4}-\d{2}-\d{2})/);
        meta.date = dateInName ? dateInName[1] : '2026-01-01';
      }

      return { slug, title: meta.title, date: meta.date, tags: meta.tags, summary: meta.summary, content: body };
    }

    // Auto-discover all .md files inside posts/ via GitHub API, with posts/index.json fallback
    async function fetchAllPosts() {
      const owner = SITE_CONFIG.githubUser;
      const repo = SITE_CONFIG.githubRepo;
      const folder = SITE_CONFIG.postsFolder;

      let fileEntries = [];
      try {
        const apiRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${folder}`);
        if (apiRes.ok) {
          const items = await apiRes.json();
          if (Array.isArray(items)) {
            fileEntries = items
              .filter(item => item.type === 'file' && /\.md$/i.test(item.name))
              .map(item => ({ name: item.name, url: `./${folder}/${encodeURIComponent(item.name)}`, fallbackUrl: item.download_url }));
          }
        }
      } catch (e) {}

      if (fileEntries.length === 0) {
        try {
          const idxRes = await fetch(`./${folder}/index.json`);
          if (idxRes.ok) {
            const list = await idxRes.json();
            if (Array.isArray(list)) {
              fileEntries = list
                .filter(name => /\.md$/i.test(name))
                .map(name => ({ name, url: `./${folder}/${encodeURIComponent(name)}`, fallbackUrl: null }));
            }
          }
        } catch (e) {}
      }

      const loaded = await Promise.all(fileEntries.map(async entry => {
        try {
          let res = await fetch(entry.url);
          if (!res.ok && entry.fallbackUrl) res = await fetch(entry.fallbackUrl);
          if (!res.ok) return null;
          const raw = await res.text();
          return parsePostFile(entry.name, raw);
        } catch (e) {
          return null;
        }
      }));

      state.posts = loaded.filter(Boolean).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
      state.loaded = true;
    }

    // Minimal Markdown renderer
    function renderInline(raw) {
      let s = escapeHtml(raw);
      const codeSlots = [];
      s = s.replace(/`([^`]+)`/g, (_, code) => {
        const idx = codeSlots.length;
        codeSlots.push(`<code>${code}</code>`);
        return `@@CODE${idx}@@`;
      });
      s = s.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g, '<img src="$2" alt="$1" loading="lazy">');
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|#\/[^\s)]+)\)/g, (_, label, url) => {
        const ext = url.startsWith('http') ? ' target="_blank" rel="noopener noreferrer"' : '';
        return `<a href="${url}"${ext}>${label}</a>`;
      });
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
      s = s.replace(/@@CODE(\d+)@@/g, (_, i) => codeSlots[Number(i)]);
      return s;
    }

    function renderMarkdown(md) {
      const lines = String(md || '').replace(/\r\n/g, '\n').split('\n');
      let html = '';
      let i = 0;

      while (i < lines.length) {
        const line = lines[i];

        if (/^```/.test(line.trim())) {
          const lang = line.trim().slice(3).trim() || 'text';
          const codeLines = [];
          i++;
          while (i < lines.length && !/^```/.test(lines[i].trim())) {
            codeLines.push(lines[i]);
            i++;
          }
          i++;
          const codeText = codeLines.join('\n');
          html += `<div class="code-block"><div class="code-header"><span>${escapeHtml(lang)}</span><button type="button" class="copy-code-btn" data-copy-code="${encodeURIComponent(codeText)}">Copy</button></div><pre><code>${escapeHtml(codeText)}</code></pre></div>`;
          continue;
        }

        if (!line.trim()) { i++; continue; }

        const hMatch = line.match(/^(#{1,3})\s+(.+)$/);
        if (hMatch) {
          const level = Math.min(3, Math.max(2, hMatch[1].length));
          html += `<h${level}>${renderInline(hMatch[2])}</h${level}>`;
          i++;
          continue;
        }

        if (/^(-{3,}|\*{3,})$/.test(line.trim())) { html += '<hr>'; i++; continue; }

        if (/^>\s?/.test(line)) {
          const qLines = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) {
            qLines.push(lines[i].replace(/^>\s?/, ''));
            i++;
          }
          html += `<blockquote><p>${qLines.map(renderInline).join('<br>')}</p></blockquote>`;
          continue;
        }

        if (/^[-*+]\s+/.test(line)) {
          html += '<ul>';
          while (i < lines.length && /^[-*+]\s+/.test(lines[i])) {
            html += `<li>${renderInline(lines[i].replace(/^[-*+]\s+/, ''))}</li>`;
            i++;
          }
          html += '</ul>';
          continue;
        }

        if (/^\d+\.\s+/.test(line)) {
          html += '<ol>';
          while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
            html += `<li>${renderInline(lines[i].replace(/^\d+\.\s+/, ''))}</li>`;
            i++;
          }
          html += '</ol>';
          continue;
        }

        const pLines = [];
        while (
          i < lines.length &&
          lines[i].trim() &&
          !/^(#{1,3}\s+|```|>\s?|[-*+]\s+|\d+\.\s+|-{3,}$|\*{3,}$)/.test(lines[i].trim())
        ) {
          pLines.push(lines[i]);
          i++;
        }
        html += `<p>${pLines.map(renderInline).join(' ')}</p>`;
      }

      return html;
    }

    function renderHome() {
      document.title = `${SITE_CONFIG.title} — Blog`;
      const app = document.getElementById('app');

      if (!state.loaded) {
        app.innerHTML = '<div class="status-box">Loading posts...</div>';
        return;
      }

      if (state.posts.length === 0) {
        app.innerHTML = `
          <div class="status-box">
            <p>No posts found in <code>${escapeHtml(SITE_CONFIG.postsFolder)}/</code> yet.</p>
            <a href="write.html" class="btn-secondary">Write your first post</a>
          </div>
        `;
        return;
      }

      const tagCounts = {};
      state.posts.forEach(p => p.tags.forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; }));
      const allTags = Object.keys(tagCounts).sort();

      app.innerHTML = `
        <section class="controls" aria-label="Filter posts">
          <div class="search-wrap">
            <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="search-input" class="search-input" placeholder="Search posts..." value="${escapeHtml(state.search)}" aria-label="Search posts">
            <button type="button" id="search-clear" class="search-clear ${state.search ? 'visible' : ''}" aria-label="Clear search">&times;</button>
          </div>
          ${allTags.length ? `
            <div class="tags-row" role="group" aria-label="Filter by tag">
              <button type="button" class="tag-btn ${state.activeTag === 'all' ? 'active' : ''}" data-tag="all">all (${state.posts.length})</button>
              ${allTags.map(t => `<button type="button" class="tag-btn ${state.activeTag === t ? 'active' : ''}" data-tag="${escapeHtml(t)}">#${escapeHtml(t)} (${tagCounts[t]})</button>`).join('')}
            </div>
          ` : ''}
        </section>
        <section id="post-list-container">${renderPostGroups()}</section>
      `;

      const searchInput = document.getElementById('search-input');
      const clearBtn = document.getElementById('search-clear');

      searchInput.addEventListener('input', e => {
        state.search = e.target.value;
        clearBtn.classList.toggle('visible', Boolean(state.search));
        updatePostListOnly();
      });

      clearBtn.addEventListener('click', () => {
        state.search = '';
        searchInput.value = '';
        clearBtn.classList.remove('visible');
        updatePostListOnly();
        searchInput.focus();
      });

      app.querySelectorAll('.tag-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.activeTag = btn.getAttribute('data-tag');
          renderHome();
        });
      });

      bindReset();
    }

    function renderPostGroups() {
      const q = state.search.trim().toLowerCase();
      const filtered = state.posts.filter(p => {
        if (state.activeTag !== 'all' && !p.tags.includes(state.activeTag)) return false;
        if (!q) return true;
        return (
          p.title.toLowerCase().includes(q) ||
          p.summary.toLowerCase().includes(q) ||
          p.content.toLowerCase().includes(q) ||
          p.tags.some(t => t.toLowerCase().includes(q))
        );
      });

      if (filtered.length === 0) {
        return `
          <div class="status-box">
            <p>No posts match that filter.</p>
            <button type="button" class="btn-secondary" id="reset-filters-btn">Show all posts</button>
          </div>
        `;
      }

      const byYear = {};
      filtered.forEach(p => {
        const y = (p.date || '').slice(0, 4) || 'Other';
        if (!byYear[y]) byYear[y] = [];
        byYear[y].push(p);
      });

      return Object.keys(byYear).sort((a, b) => b.localeCompare(a)).map(year => `
        <div class="year-group">
          <h2 class="year-label">${escapeHtml(year)}</h2>
          <ul class="post-list">
            ${byYear[year].map(p => `
              <li class="post-item">
                <a href="#/post/${encodeURIComponent(p.slug)}" class="post-link">
                  <time class="post-date" datetime="${escapeHtml(p.date)}">${escapeHtml(formatShortDate(p.date))}</time>
                  <div>
                    <h3 class="post-title">${escapeHtml(p.title)}</h3>
                    ${p.summary ? `<p class="post-excerpt">${escapeHtml(p.summary)}</p>` : ''}
                    <div class="post-meta-inline">
                      <span>${escapeHtml(readingTime(p.content))}</span>
                      ${p.tags.map(t => `<span class="post-tag-pill">#${escapeHtml(t)}</span>`).join('')}
                    </div>
                  </div>
                </a>
              </li>
            `).join('')}
          </ul>
        </div>
      `).join('');
    }

    function updatePostListOnly() {
      const container = document.getElementById('post-list-container');
      if (container) {
        container.innerHTML = renderPostGroups();
        bindReset();
      }
    }

    function bindReset() {
      const btn = document.getElementById('reset-filters-btn');
      if (btn) {
        btn.addEventListener('click', () => {
          state.search = '';
          state.activeTag = 'all';
          renderHome();
        });
      }
    }

    function renderPost(slug) {
      const app = document.getElementById('app');
      if (!state.loaded) {
        app.innerHTML = '<div class="status-box">Loading post...</div>';
        return;
      }

      const idx = state.posts.findIndex(p => p.slug === slug);
      if (idx === -1) {
        document.title = `Not Found — ${SITE_CONFIG.title}`;
        app.innerHTML = `
          <div class="status-box">
            <p>That post doesn't exist.</p>
            <a href="#/" class="btn-secondary">Back to all posts</a>
          </div>
        `;
        return;
      }

      const post = state.posts[idx];
      const newer = idx > 0 ? state.posts[idx - 1] : null;
      const older = idx < state.posts.length - 1 ? state.posts[idx + 1] : null;
      document.title = `${post.title} — ${SITE_CONFIG.title}`;

      app.innerHTML = `
        <a href="#/" class="back-link">&larr; All posts</a>
        <article>
          <header class="article-header">
            <h1 class="article-title">${escapeHtml(post.title)}</h1>
            <div class="article-meta">
              <time datetime="${escapeHtml(post.date)}">${escapeHtml(formatFullDate(post.date))}</time>
              <span>&middot;</span>
              <span>${escapeHtml(readingTime(post.content))}</span>
              ${post.tags.map(t => `<a href="#/" class="post-tag-pill" data-jump-tag="${escapeHtml(t)}">#${escapeHtml(t)}</a>`).join('')}
            </div>
          </header>
          <div class="prose">${renderMarkdown(post.content)}</div>
        </article>
        <nav class="article-footer-nav" aria-label="Post navigation">
          <div>
            ${older ? `<a href="#/post/${encodeURIComponent(older.slug)}" class="pager-link"><span class="pager-label">&larr; Older</span><span class="pager-title">${escapeHtml(older.title)}</span></a>` : ''}
          </div>
          <div>
            ${newer ? `<a href="#/post/${encodeURIComponent(newer.slug)}" class="pager-link next"><span class="pager-label">Newer &rarr;</span><span class="pager-title">${escapeHtml(newer.title)}</span></a>` : ''}
          </div>
        </nav>
      `;

      app.querySelectorAll('[data-jump-tag]').forEach(link => {
        link.addEventListener('click', e => {
          e.preventDefault();
          state.activeTag = link.getAttribute('data-jump-tag');
          state.search = '';
          window.location.hash = '#/';
        });
      });

      app.querySelectorAll('[data-copy-code]').forEach(btn => {
        btn.addEventListener('click', () => {
          copyText(decodeURIComponent(btn.getAttribute('data-copy-code')), 'Code copied');
        });
      });

      window.scrollTo(0, 0);
    }

    function route() {
      const hash = window.location.hash || '#/';
      if (hash.startsWith('#/post/')) {
        renderPost(decodeURIComponent(hash.slice('#/post/'.length)));
      } else {
        renderHome();
      }
    }

    async function init() {
      document.getElementById('site-title').textContent = SITE_CONFIG.title;
      const mainLink = document.getElementById('main-site-link');
      mainLink.textContent = SITE_CONFIG.mainSiteLabel;
      mainLink.href = SITE_CONFIG.mainSiteUrl;
      document.getElementById('footer-github').href = `https://github.com/${SITE_CONFIG.githubUser}`;
      document.getElementById('footer-copy').textContent = `© ${new Date().getFullYear()} ${SITE_CONFIG.author}`;

      initTheme();
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || 'light';
        applyTheme(current === 'dark' ? 'light' : 'dark');
      });

      window.addEventListener('hashchange', route);
      await fetchAllPosts();
      route();
    }

    init();
  </script>
</body>
</html>
